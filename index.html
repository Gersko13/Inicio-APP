<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasatop - Inicio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://tasatop.com.pe/wp-content/uploads/elementor/thumbs/logos-17-r320c27cra7m7te2fafiia4mrbqd3aqj7ifttvy33g.png" 
         alt="Logo Tasatop" 
         class="header-image">
            <h1>Bienvenido a Tasatop</h1>
            <p class="subtitle">Invierte de forma segura y 100% digital</p>
            
            <div class="button-container">
                <button class="btn text-btn" id="loginBtn">
                    <i class="fas fa-lock"></i>
                    Iniciar sesión
                </button>
                <button class="btn ghost-btn">
                    <i class="fab fa-google"></i>
                    Conectar con Google
                </button>
                <button class="btn primary-btn">
                    <i class="fas fa-user-plus"></i>
                    Crear cuenta
                </button>
            </div>
            
            <p class="footer-text">¿Ya tienes cuenta? <a href="#" id="toggleLogin">Inicia sesión</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
